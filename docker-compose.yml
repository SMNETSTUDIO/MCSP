services:
  mcsp:
    build: .
    image: ghcr.io/smnetstudio/mcsp:latest
    container_name: mcsp
    restart: unless-stopped
    ports:
      - "3000:3000"        # 面板
      - "25565:25565"      # Minecraft 实例(多实例时按需追加映射)
    environment:
      - PORT=3000
      # - JAVA_BIN=/path/to/java        # 一般无需设置:面板内可一键安装 Temurin 到 bin/java
      # - MCSP_MAX_UPLOAD_MB=2048       # 单个上传文件上限
      # - MCSP_MAX_EXTRACT_MB=8192      # 解压后总体积上限(防 zip bomb 占满磁盘)
      # - MCSP_UPLOAD_CHUNK_MB=5        # 大文件分片上传的片大小。默认 5 是为了绕开
      #                                 # 隧道/Worker 反代常见的 ~10MB 请求体上限,
      #                                 # 前面没有这类限制时可以调大
      # - MCSP_UPLOAD_CONCURRENCY=3     # 浏览器同时在途的上传请求数
      # - MCSP_TRUSTED_ORIGINS=https://mc.example.com,https://panel.example.com
      #                                 # 跨站校验的额外放行来源(逗号分隔,含协议)。
      #                                 # 一般不用配:同源访问自动通过。只有当反代
      #                                 # 没透传 Host 头、或你用多个域名访问同一面板时
      #                                 # 才需要 —— 否则写操作会被拒并提示"跨站请求被拒绝"
    volumes:
      - mcsp-data:/app/data            # 账户 / 会话 / 注册表 / 计划任务
      - mcsp-instances:/app/instances  # 服务端实例(世界存档)
      - mcsp-backups:/app/backups      # tar.gz 备份
      - mcsp-bin:/app/bin              # Java 运行时与穿透组件
      - mcsp-logs:/app/logs

volumes:
  mcsp-data:
  mcsp-instances:
  mcsp-backups:
  mcsp-bin:
  mcsp-logs:
