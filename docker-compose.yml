services:
  mcsp:
    build: .
    image: ghcr.io/smnetstudio/mcsp:latest
    container_name: mcsp
    restart: unless-stopped
    ports:
      - "3000:3000"        # 面板
      - "25565:25565"      # Minecraft 实例(多实例时按需追加映射)
    environment:
      - PORT=3000
      # - JAVA_BIN=/path/to/java   # 一般无需设置:面板内可一键安装 Temurin 到 bin/java
    volumes:
      - mcsp-data:/app/data            # 账户 / 会话 / 注册表 / 计划任务
      - mcsp-instances:/app/instances  # 服务端实例(世界存档)
      - mcsp-backups:/app/backups      # tar.gz 备份
      - mcsp-bin:/app/bin              # Java 运行时与穿透组件
      - mcsp-logs:/app/logs

volumes:
  mcsp-data:
  mcsp-instances:
  mcsp-backups:
  mcsp-bin:
  mcsp-logs:
